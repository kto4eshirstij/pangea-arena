// Pangea Arena: рендерер OpenGL2 — качество для собственных карт (карты нормалей, спекуляр, deluxe, HDR).
// Выполняется клиентом: +exec cfg/pangea-gl2.cfg (веб-обёртка arena-boot.js добавляет это в аргументы).
seta cl_renderer "opengl2"
seta r_normalMapping "1"
seta r_specularMapping "1"
seta r_deluxeMapping "1"
seta r_parallaxMapping "0"
seta r_cubeMapping "0"
seta r_hdr "1"
seta r_toneMap "1"
seta r_autoExposure "1"
seta r_sunlightMode "1"
seta r_sunShadows "0"
seta r_ssao "0"
seta r_dlightMode "1"
seta r_pbr "0"
seta r_ext_texture_filter_anisotropic "1"
seta r_ext_max_anisotropy "8"
seta r_picmip "0"
seta r_texturebits "32"
seta r_overBrightBits "0"
seta r_mapOverBrightBits "2"
seta r_gamma "1.1"
